services:
  - type: web
    name: jpvnk
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: JPVNK
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://jpvnk.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: mysql-1b9c9db7-jpvnkmedia-2aba.k.aivencloud.com
      - key: DB_PORT
        value: 27306
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: false
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: jpvnkmedia@gmail.com
      - key: MAIL_FROM_NAME
        value: Jabatan Perkhidmatan Veterinar Negeri Kelantan
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
